name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build dew_flow_mcp.slnx -c Release

      # xUnit v3 on Microsoft Testing Platform: the test project builds into a self-contained
      # runner executable. `dotnet test` has no VSTest host here and would abort — never use it.
      - name: Test
        run: ./tests/Mcp.Tests/bin/Release/net10.0/Mcp.Tests
